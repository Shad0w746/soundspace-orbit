[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundspace-orbit"
version = "0.1.0"
description = "Standalone 8D-style audio converter for local files and supported web audio URLs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Dan Walker" }
]
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "yt-dlp>=2024.8.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
build = [
  "pyinstaller>=6.0"
]

[project.scripts]
soundspace-orbit = "soundspace_orbit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soundspace_orbit*"]
